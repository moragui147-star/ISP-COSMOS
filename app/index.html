<style>
:root{
  --bg:#060B15;--surface:#0C1423;--surface2:#111C30;--surface3:#18243A;
  --border:#1E2D45;--border2:#253450;
  --accent:#00D9F5;--accent-dim:rgba(0,217,245,.13);
  --green:#00C896;--green-dim:rgba(0,200,150,.12);
  --red:#FF4757;--red-dim:rgba(255,71,87,.12);
  --orange:#FFB300;--orange-dim:rgba(255,179,0,.12);
  --purple:#7C3AED;--purple-dim:rgba(124,58,237,.12);
  --text:#D8E8F4;--text2:#6A8CA8;--text3:#3A5068;
  --r:10px;--sh:0 4px 28px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
input,select,textarea{font-family:'Outfit',sans-serif;}
button{cursor:pointer;font-family:'Outfit',sans-serif;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* LOGIN */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 50%,rgba(0,217,245,.06) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 20%,rgba(0,200,150,.05) 0%,transparent 50%),var(--bg);
}
.login-card{
  width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:40px;box-shadow:var(--sh);
}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .sig{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);letter-spacing:1px;}
.login-logo .sub{font-size:12px;color:var(--text2);margin-top:4px;}

/* APP */
#app{display:none;min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{
  width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;
}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-logo .brand{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--accent);}
.sb-logo .version{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.sb-logo .role-badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;}

.sb-nav{flex:1;padding:12px 0;overflow-y:auto;}
.sb-section{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text3);padding:14px 20px 6px;text-transform:uppercase;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:var(--text2);
  cursor:pointer;transition:.15s;border-left:3px solid transparent;
}
.sb-item:hover{background:var(--surface2);color:var(--text);}
.sb-item.active{background:var(--accent-dim);color:var(--accent);border-left-color:var(--accent);}
.sb-item .icon{font-size:16px;width:20px;text-align:center;}

.sb-user{padding:16px;border-top:1px solid var(--border);flex-shrink:0;}
.sb-user .uname{font-size:13px;font-weight:600;}
.sb-user .urole{font-size:11px;color:var(--text2);}

/* MAIN */
#main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(6,11,21,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:12px 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;}
.topbar-meta{font-size:12px;color:var(--text2);}
#content{padding:28px;flex:1;}

/* CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;
  transition:.2s;
}
.kpi-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.kpi-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.kpi-card.accent{border-color:var(--accent);background:var(--accent-dim);}
.kpi-card.green{border-color:var(--green);background:var(--green-dim);}
.kpi-card.red{border-color:var(--red);background:var(--red-dim);}
.kpi-card.orange{border-color:var(--orange);background:var(--orange-dim);}

/* PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.panel-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.panel-body{padding:20px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  background:var(--surface2);color:var(--text2);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.8px;padding:10px 14px;text-align:left;
  border-bottom:1px solid var(--border);
}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.b-green{background:var(--green-dim);color:var(--green);}
.b-red{background:var(--red-dim);color:var(--red);}
.b-orange{background:var(--orange-dim);color:var(--orange);}
.b-blue{background:var(--accent-dim);color:var(--accent);}
.b-gray{background:rgba(100,120,140,.12);color:var(--text2);}
.b-purple{background:var(--purple-dim);color:#A78BFA;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;
  font-size:13px;font-weight:500;border:none;transition:.15s;cursor:pointer;
}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#33E4FF;filter:brightness(1.05);}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-outline:hover{background:var(--surface2);color:var(--text);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{background:var(--green-dim);color:var(--green);border:1px solid var(--green);}
.btn-green:hover{background:var(--green);color:#000;}
.btn-icon{padding:6px;border-radius:6px;}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.cols1{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group.span2{grid-column:span 2;}
label{font-size:12px;color:var(--text2);font-weight:500;}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:.15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
input::placeholder{color:var(--text3);}
select option{background:var(--surface);}
textarea{resize:vertical;min-height:80px;}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
.input-err{border-color:var(--red)!important;}
.err-msg{font-size:11px;color:var(--red);}

/* SEARCH BAR */
.search-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;}
.search-input{flex:1;max-width:300px;}

/* MODAL */
#modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px;
}
#modal-overlay.open{display:flex;}
#modal-box{
  background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border);}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;padding:4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* TOAST */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;
}
.toast-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;font-size:13px;min-width:240px;max-width:360px;
  box-shadow:var(--sh);animation:slideIn .2s ease;
  display:flex;align-items:center;gap:10px;
}
.toast-item.success{border-left:3px solid var(--green);}
.toast-item.error{border-left:3px solid var(--red);}
.toast-item.info{border-left:3px solid var(--accent);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:10px 20px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:.15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:var(--text2);}
.empty .icon{font-size:48px;margin-bottom:12px;}
.empty p{font-size:14px;}

/* INFO BLOCKS */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.info-item label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;}
.info-item .val{font-size:13px;font-weight:500;}

.portal-hero .plan-speed{color:var(--accent);font-size:14px;margin-top:4px;}

.status-bubble.active{background:var(--green-dim);color:var(--green);border:1px solid var(--green);}
.status-bubble.suspended{background:var(--red-dim);color:var(--red);border:1px solid var(--red);}
.status-bubble.pending{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange);}

  border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;

.alert-box.warning{background:var(--orange-dim);border:1px solid var(--orange);color:var(--orange);}
.alert-box.danger{background:var(--red-dim);border:1px solid var(--red);color:var(--red);}
.alert-box.success{background:var(--green-dim);border:1px solid var(--green);color:var(--green);}
.alert-box.info{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);}
.alert-box .a-title{font-weight:600;font-size:13px;}
.alert-box .a-body{font-size:12px;margin-top:3px;opacity:.85;}

<script>
// La configuración de Firebase se carga desde js/firebase-config.js (fuera del repositorio)
const firebaseConfig = window.firebaseConfig;
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Campos de S que se guardan/leen en Firestore (todo excepto sesión/UI)
const PERSISTED_KEYS = ['planes','contratos','facturas','pagos','tickets','audit','config','users','nextIds','cierreHoy','ordenesRetiro'];
const STATE_DOC = db.collection('isp_data').doc('main');

// Carga el estado desde Firestore. Si el documento no existe (primera vez),
// sube los datos de ejemplo que trae la app como semilla inicial.
async function loadState(){
  const snap = await STATE_DOC.get();
  if(snap.exists){
    const data = snap.data();
    PERSISTED_KEYS.forEach(k=>{ if(data[k]!==undefined) S[k]=data[k]; });
  } else {
    const seed={};
    PERSISTED_KEYS.forEach(k=>seed[k]=S[k]);
    await STATE_DOC.set(seed);
  }
}

// Guarda el estado actual completo en Firestore.
async function saveState(){
  try{
    const data={};
    PERSISTED_KEYS.forEach(k=>data[k]=S[k]);
    await STATE_DOC.set(data);
  }catch(e){
    console.error('Error guardando en Firestore:', e);
    toast('⚠️ No se pudo guardar en la base de datos','error');
  }
}
</script>

const fmt = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(n);
const fmtNum = n => new Intl.NumberFormat('es-CO').format(n);
const today = () => new Date().toISOString().split('T')[0];
const now = () => new Date().toLocaleString('es-CO',{timeZone:'America/Bogota'}).replace(',','');
// Fecha/hora en formato ISO ordenable (AAAA-MM-DD HH:MM:SS), hora Colombia.
// Se usa para TODO lo que se vaya a filtrar por mes/día (pagos, cierres,
// reportes). now() de arriba es solo para mostrar en pantalla/auditoría.
const nowISO = () => new Date(Date.now()-5*60*60*1000).toISOString().slice(0,19).replace('T',' ');
const addDias = (fechaStr,n) => { const d=new Date(fechaStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; };
const diasDesde = (fechaStr) => { const a=new Date(fechaStr+'T00:00:00'); const b=new Date(today()+'T00:00:00'); return Math.round((b-a)/86400000); };

// ═══════════════ FACTURACIÓN AUTOMÁTICA Y SUSPENSIÓN POR MORA ═══════════════
// Genera facturas cada 30 días contados desde la fecha de inicio de cada
// contrato (no por mes calendario), y suspende automáticamente el servicio
// si una factura lleva más de S.config.diasGracia días vencida sin pago.
function procesarFacturacionAutomatica(){
  let facturasGeneradas=0, vencidas=0;
  S.contratos.forEach(c=>{
    if(c.estado==='Cancelado'||c.estado==='Pendiente de instalación') return;
    if(!c.proximoVencimiento){
      // Primera vez: parte de la última factura conocida (o de la fecha de alta)
      // y avanza en silencio hasta la próxima fecha futura, sin generar
      // facturas retroactivas de ciclos ya pasados (evita "backlog" al migrar).
      const ultimasF=S.facturas.filter(f=>f.cId===c.id).map(f=>f.vence).sort();
      let base=ultimasF.length?ultimasF[ultimasF.length-1]:c.fecha;
      let prox=addDias(base,30);
      let guard0=0;
      while(prox<today()&&guard0<600){ prox=addDias(prox,30); guard0++; }
      c.proximoVencimiento=prox;
    }
    let guard=0;
    while(c.proximoVencimiento<=today() && guard<60){
      guard++;
      const yaExiste=S.facturas.find(f=>f.cId===c.id&&f.vence===c.proximoVencimiento);
      if(!yaExiste){
        const pl=getPlan(c.planId);
        if(pl){
          const id=S.nextIds.factura++;
          S.facturas.push({id,num:`FAC-${String(id).padStart(4,'0')}`,cId:c.id,periodo:c.proximoVencimiento.slice(0,7),base:pl.precio,recargo:0,vence:c.proximoVencimiento,estado:'Pendiente',fechaPago:null,cajero:null});
          facturasGeneradas++;
        }
      }
      c.proximoVencimiento=addDias(c.proximoVencimiento,30);
    }
  });
  S.facturas.forEach(f=>{
    if(f.estado==='Pendiente'&&diasDesde(f.vence)>0){
      const c=getContrato(f.cId);
      f.estado='Vencida';
      f.emailPendiente='vencida';
      vencidas++;
      if(c) f.recargo=Math.round(f.base*(S.config.porcMora/100));
    }
    // La suspensión del servicio ya NO es automática: se marca la factura
    // como "Vencida" y se avisa por correo, pero el corte lo hace el
    // administrador manualmente desde Contratos → 🚫 Suspender.
  });
  if(facturasGeneradas>0||vencidas>0){
    S.audit.unshift({id:Date.now(),usuario:'Sistema',fecha:now(),accion:'Proceso automático de facturación',detalle:`${facturasGeneradas} factura(s) generada(s) · ${vencidas} factura(s) marcada(s) como vencida(s). La suspensión sigue siendo manual.`});
    saveState();
  }
}


function getPlan(id){return S.planes.find(p=>p.id===id)||null;}
function getContrato(id){return S.contratos.find(c=>c.id===id)||null;}
function getContratoByNum(num){return S.contratos.find(c=>c.num===num)||null;}
function getFactura(id){return S.facturas.find(f=>f.id===id)||null;}
function getFacturaByNum(num){return S.facturas.find(f=>f.num===num)||null;}

function facturaMonto(f){return f.base+f.recargo;}

// ═══════════════════════════════ AUTH ═══════════════════════════════
// La sesión se guarda en este dispositivo (localStorage) y se restaura sola
// al abrir la página. Solo se borra al pulsar "Cerrar sesión".
const SESSION_KEY='isp_sesion';

function buscarUsuario(u,p){
  // Personal (admin / cajero / contador)
  let usr=S.users.find(x=>x.u===u&&x.p===p);
  // Cliente (cédula + contraseña del portal)
  if(!usr){
    const c=S.contratos.find(x=>x.cedula===u&&x.pass===p);
    if(c) usr={u:c.cedula,p:c.pass,rol:'cliente',nombre:c.nombre,cId:c.id};
  }
  return usr||null;
}
function guardarSesion(u,p){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({u,p})); }
  catch(e){ console.warn('No se pudo guardar la sesión:',e); }
}
function borrarSesion(){
  try{ localStorage.removeItem(SESSION_KEY); localStorage.removeItem('isp_recordar_login'); }catch(e){}
}
function entrarAlSistema(usr){
  S.user=usr;
  $('login-screen').style.display='none';
  $('app').style.display='block';
  initApp();
}
// Devuelve true si había una sesión guardada válida y entró automáticamente.
function restaurarSesion(){
  try{
    const g=localStorage.getItem(SESSION_KEY);
    if(!g) return false;
    const {u,p}=JSON.parse(g);
    const usr=buscarUsuario(u,p);
    if(!usr){ borrarSesion(); return false; } // usuario borrado o contraseña cambiada
    entrarAlSistema(usr);
    return true;
  }catch(e){
    console.warn('No se pudo restaurar la sesión:',e);
    return false;
  }
}
function login(){
  const u=$('l-user').value.trim();
  const p=$('l-pass').value;
  const usr=buscarUsuario(u,p);
  if(!usr){$('l-err').style.display='block';return;}
  $('l-err').style.display='none';
  guardarSesion(u,p);
  entrarAlSistema(usr);
}
function logout(){
  borrarSesion();
  S.user=null;
  $('app').style.display='none';
  $('login-screen').style.display='flex';
  $('l-user').value=''; $('l-pass').value='';
}

// ═══════════════════════════════ RECUPERACIÓN DE CONTRASEÑA ═══════════════════════════════
// El navegador no puede enviar correos por sí solo: esta función solo deja
// una "solicitud" en Firestore. Una Cloud Function (ver funciones/) la
// detecta, genera una contraseña temporal y la envía al correo de
// recuperación configurado en Configuración → Seguridad.
function solicitarRecuperacion(){
  openModal('¿Olvidaste tu contraseña?',`
    <div class="alert-box info"><div class="a-body">Se enviará una contraseña temporal al correo de recuperación configurado por el administrador.</div></div>
    <div class="form-grid cols1" style="gap:12px">
      <div class="form-group"><label>Usuario</label><input id="rec-user" placeholder="admin"></div>
      <div id="rec-err" class="err-msg" style="display:none"></div>
      <div id="rec-ok" style="color:var(--green);font-size:13px;display:none"></div>
    </div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cerrar</button>
     <button class="btn btn-primary" onclick="enviarSolicitudRecuperacion()">Enviar</button>`
  );
}

async function enviarSolicitudRecuperacion(){
  const usuario=$('rec-user').value.trim();
  const err=$('rec-err'); const ok=$('rec-ok');
  err.style.display='none'; ok.style.display='none';
  if(!usuario){err.textContent='Escribe tu usuario.';err.style.display='block';return;}
  try{
    await STATE_DOC.set({ solicitudRecuperacion: { usuario, token: Date.now() } }, { merge: true });
  }catch(e){
    console.error(e);
  }
  // Mensaje siempre genérico (exista o no el usuario, o exista o no correo
  // configurado) para no revelar información a quien intente adivinar usuarios.
  ok.textContent='Si el usuario existe y hay un correo de recuperación configurado, llegará una contraseña temporal en unos minutos.';
  ok.style.display='block';
}

function mesesDisponiblesDashboard(){
  // Todos los meses donde hay pagos o facturas registradas, + el mes actual
  // (aunque todavía no tenga movimientos), del más reciente al más viejo.
  const mesActual=today().slice(0,7);
  const set=new Set([
    ...S.pagos.map(p=>p.fecha.slice(0,7)),
    ...S.facturas.map(f=>f.periodo),
  ]);
  set.add(mesActual);
  return [...set].sort().reverse();
}

}

function guardarContrato(id){
  const n=$('fc-nombre').value.trim();
  const ced=$('fc-cedula').value.trim();
  const dir=$('fc-dir').value.trim();
  const tel=$('fc-tel').value.trim();
  const apto=$('fc-apto').value.trim();
  const email=$('fc-email').value.trim();
  const planId=parseInt($('fc-plan').value);
  const pass=$('fc-pass').value.trim();
  const mikrotikIp=$('fc-mk-ip').value.trim();
  const mikrotikUser=$('fc-mk-user').value.trim();
  const mikrotikPass=$('fc-mk-pass').value.trim();
  const mikrotikInterface=$('fc-mk-if').value.trim();
  const err=$('fc-err');
  if(!n||!ced||!dir||!tel||!planId||!pass){err.textContent='Complete los campos obligatorios (*).';err.style.display='block';return;}
  // Validar cedula única
  const dup=S.contratos.find(c=>c.cedula===ced&&c.estado!=='Cancelado'&&c.id!==id);
  if(dup){err.textContent='Ya existe un contrato activo con esta cédula.';err.style.display='block';return;}
  if(id){
    const c=getContrato(id);
    const oldPlan=getPlan(c.planId);
    Object.assign(c,{nombre:n,cedula:ced,dir,apto,tel,email,planId,pass,mikrotikIp,mikrotikUser,mikrotikPass,mikrotikInterface});
    if(c.planId!==planId) addAudit('Cambio de plan',`${c.num}: ${oldPlan?.nombre||'?'} → ${getPlan(planId)?.nombre||'?'}`);
    else addAudit('Contrato editado',`${c.num} — ${n}`);
    toast('Contrato actualizado correctamente','success');
  } else {
    const newId=S.nextIds.contrato++;
    const num=`CT-${String(newId).padStart(3,'0')}`;
    S.contratos.push({id:newId,num,cedula:ced,nombre:n,dir,apto,tel,email,planId,mac:'',estado:'Pendiente de instalación',periodosDeuda:0,fecha:today(),pass,mikrotikIp,mikrotikUser,mikrotikPass,mikrotikInterface,proximoVencimiento:addDias(today(),30)});
    addAudit('Nuevo contrato',`${num} — ${n}`);
    toast(`Contrato ${num} creado. Registre la MAC para activar.`,'success');
  }
  closeModal();renderContratos();
}

// Descarga TODOS los clientes con toda su información en un solo Excel.
function exportarClientesExcel(){
  if(S.contratos.length===0){toast('No hay clientes para exportar','info');return;}
  const headers=['num','nombre','cedula','direccion','apartamento','telefono','email','plan','velocidad','precio_plan','estado','mac','fecha_instalacion','proxima_factura','contraseña_portal','mikrotik_ip','mikrotik_usuario','mikrotik_password','mikrotik_interfaz','facturas_totales','facturas_pendientes','facturas_vencidas','ultimo_pago'];
  const filas=S.contratos.map(c=>{
    const pl=getPlan(c.planId);
    const facsCliente=S.facturas.filter(f=>f.cId===c.id);
    const pagosCliente=S.pagos.filter(p=>p.cId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    return [
      c.num,c.nombre,c.cedula,c.dir,c.apto||'',c.tel,c.email||'',
      pl?pl.nombre:'',pl?`${pl.bajada}/${pl.subida} Mbps`:'',pl?pl.precio:'',
      c.estado,c.mac||'',c.fecha||'',c.proximoVencimiento||'',c.pass||'',
      c.mikrotikIp||'',c.mikrotikUser||'',c.mikrotikPass||'',c.mikrotikInterface||'',
      facsCliente.length,
      facsCliente.filter(f=>f.estado==='Pendiente').length,
      facsCliente.filter(f=>f.estado==='Vencida').length,
      pagosCliente[0]?pagosCliente[0].fecha:''
    ];
  });
  const ws=XLSX.utils.aoa_to_sheet([headers,...filas]);
  ws['!cols']=headers.map(()=>({wch:20}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Clientes');

  XLSX.writeFile(wb,`clientes_${S.config.empresa.replace(/\s+/g,'_')}_${fechaArchivo}.xlsx`);
  addAudit('Exportación de clientes',`Se descargó el listado completo de ${S.contratos.length} clientes en Excel.`);
}

function procesarArchivoCargaMasiva(){
  const input=$('cm-file');
  const resultado=$('cm-resultado');
  const file=input.files[0];
  if(!file){resultado.innerHTML='<span style="color:var(--red)">Selecciona un archivo primero.</span>';return;}
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const filas=XLSX.utils.sheet_to_json(sheet,{defval:''});
      let creados=0; const errores=[];
      filas.forEach((fila,idx)=>{
        const numFila=idx+2; // +2: fila 1 son encabezados
        const nombre=String(fila.nombre||'').trim();
        const cedula=String(fila.cedula||'').trim();
        const direccion=String(fila.direccion||'').trim();
        const apto=String(fila.apartamento||'').trim();
        const telefono=String(fila.telefono||'').trim();
        const email=String(fila.email||'').trim();
        const planNombre=String(fila.plan||'').trim();
        const pass=String(fila['contraseña_portal']||fila.contrasena_portal||fila.pass||'').trim();
        let fechaInicio=fila.fecha_inicio;
        if(fechaInicio instanceof Date) fechaInicio=fechaInicio.toISOString().split('T')[0];
        else fechaInicio=String(fechaInicio||'').trim().slice(0,10);
        const mikrotikIp=String(fila.mikrotik_ip||'').trim();
        const mikrotikUser=String(fila.mikrotik_usuario||'').trim();
        const mikrotikPass=String(fila.mikrotik_password||'').trim();
        const mikrotikInterface=String(fila.mikrotik_interfaz||'').trim();

        if(!nombre&&!cedula) return; // fila vacía, se ignora sin marcar error
        if(!nombre||!cedula||!direccion||!telefono||!planNombre||!pass){errores.push(`Fila ${numFila}: faltan campos obligatorios.`);return;}
        if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaInicio)){errores.push(`Fila ${numFila}: fecha_inicio inválida ("${fechaInicio}"). Usa AAAA-MM-DD.`);return;}
        const plan=S.planes.find(p=>p.nombre.toLowerCase()===planNombre.toLowerCase()&&p.activo);
        if(!plan){errores.push(`Fila ${numFila}: el plan "${planNombre}" no existe o está inactivo.`);return;}
        const dup=S.contratos.find(c=>c.cedula===cedula&&c.estado!=='Cancelado');
        if(dup){errores.push(`Fila ${numFila}: ya existe un contrato activo con la cédula ${cedula}.`);return;}

        const newId=S.nextIds.contrato++;
        const num=`CT-${String(newId).padStart(3,'0')}`;
        S.contratos.push({id:newId,num,cedula,nombre,dir:direccion,apto,tel:telefono,email,planId:plan.id,mac:'',estado:'Pendiente de instalación',periodosDeuda:0,fecha:fechaInicio,pass,mikrotikIp,mikrotikUser,mikrotikPass,mikrotikInterface,proximoVencimiento:addDias(fechaInicio,30)});
        creados++;
      });
      if(creados>0) addAudit('Carga masiva de contratos',`${creados} contrato(s) creado(s) desde archivo "${file.name}".`);
      resultado.innerHTML=`
        <div style="color:var(--green);font-weight:600">✅ ${creados} contrato(s) creado(s) correctamente.</div>
        ${errores.length?`<div style="color:var(--red);margin-top:8px"><strong>${errores.length} fila(s) con problemas:</strong><ul style="margin:6px 0 0 18px;padding:0">${errores.map(e=>`<li>${e}</li>`).join('')}</ul></div>`:''}
      `;
      if(creados>0){ toast(`${creados} contratos creados`,'success'); renderContratos(); }
    }catch(err){
      console.error(err);
      resultado.innerHTML=`<span style="color:var(--red)">Error leyendo el archivo: ${err.message}. Verifica que sea el formato de la plantilla.</span>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

// Edita solo la fecha de instalación de un contrato, y recalcula desde ahí
// el ciclo de facturación de 30 días (sin tocar facturas ya generadas).
// Suspensión y reactivación manuales del servicio (el corte real en Mikrotik
// ya no es automático por mora: el correo avisa, pero el admin decide cuándo).
function confirmarSuspenderManual(id){
  const c=getContrato(id);
  if(!c) return;
  const facVencida=S.facturas.find(f=>f.cId===id&&f.estado==='Vencida');
  openModal(`🚫 Suspender servicio — ${c.num}`,`
    <div class="alert-box warning">
      <div class="a-title">¿Suspender a ${c.nombre}?</div>
      <div class="a-body">
        ${facVencida?`Tiene la factura <strong>${facVencida.num}</strong> vencida desde el ${facVencida.vence}.`:'No tiene facturas vencidas registradas.'}<br>
        Esto marca el contrato como "Suspendido por mora" y envía la instrucción de corte al Mikrotik.
      </div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" style="background:var(--orange)" onclick="suspenderManual(${id})">Sí, suspender</button>`
  );
}

function suspenderManual(id){
  const c=getContrato(id);
  c.estado='Suspendido por mora';
  c.mikrotikPendiente='desconectar';
  addAudit('Suspensión manual por mora',`${c.num} — ${c.nombre}. Instrucción de corte enviada a Mikrotik.`);
  toast(`${c.nombre} suspendido.`,'success');
  closeModal();renderContratos();
}

function reactivarManual(id){
  const c=getContrato(id);
  c.estado='Activo';
  c.mikrotikPendiente='conectar';
  addAudit('Reactivación manual',`${c.num} — ${c.nombre}. Instrucción de reconexión enviada a Mikrotik.`);
  toast(`${c.nombre} reactivado.`,'success');
  renderContratos();
}

function abrirEditarFecha(id){

  openModal(`📅 Editar Fecha de Instalación — ${c.num}`,`
    <div class="alert-box warning"><div class="a-body">Esta fecha define el ciclo de facturación automática cada 30 días de <strong>${c.nombre}</strong>. Las facturas que ya se generaron NO se modifican; solo cambia cuándo se genera la próxima.</div></div>
    <div class="form-group"><label>Fecha de instalación</label><input type="date" id="ef-fecha" value="${c.fecha}"></div>
    <div id="ef-err" class="err-msg" style="display:none"></div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="guardarFechaInicio(${id})">Guardar</button>`
  );

function guardarFechaInicio(id){
  const c=getContrato(id);
  const nueva=$('ef-fecha').value;
  const err=$('ef-err');
  if(!nueva){err.textContent='Selecciona una fecha.';err.style.display='block';return;}
  const anterior=c.fecha;
  c.fecha=nueva;
  // Próximo ciclo: desde la última factura ya generada de este cliente
  // (si existe) o desde la nueva fecha de instalación.
  const ultimasF=S.facturas.filter(f=>f.cId===c.id).map(f=>f.vence).sort();
  const base=ultimasF.length?ultimasF[ultimasF.length-1]:nueva;
  c.proximoVencimiento=addDias(base,30);
  addAudit('Fecha de instalación editada',`${c.num} — ${c.nombre}: ${anterior} → ${nueva}. Próxima factura: ${c.proximoVencimiento}`);
  toast('Fecha de instalación actualizada','success');
  closeModal();renderContratos();
}

  const c=getContrato(id);

    <div class="form-grid cols1">
      <div class="form-group"><label>Dirección MAC del Router Cliente *</label>
        <input id="mac-val" value="${c.mac||''}" placeholder="AA:BB:CC:DD:EE:FF" style="font-family:'JetBrains Mono',monospace">
        <span style="font-size:11px;color:var(--text2)">Formato: 6 grupos de 2 dígitos hexadecimales separados por ':'</span>
      </div>
      <div id="mac-err" class="err-msg" style="display:none"></div>
    </div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="guardarMAC(${id})">Registrar y Activar</button>`

function guardarMAC(id){
  const mac=$('mac-val').value.trim().toUpperCase();
  const err=$('mac-err');
  const macReg=/^([0-9A-F]{2}[:\-]){5}[0-9A-F]{2}$/;
  if(!macReg.test(mac)){err.textContent='Formato inválido. Use AA:BB:CC:DD:EE:FF';err.style.display='block';return;}
  const dup=S.contratos.find(c=>c.mac===mac&&c.id!==id&&c.estado!=='Cancelado');
  if(dup){err.textContent=`MAC ya registrada en contrato ${dup.num}.`;err.style.display='block';return;}
  const c=getContrato(id);
  c.mac=mac;
  c.estado='Activo';
  c.mikrotikPendiente='conectar';
  if(!c.proximoVencimiento) c.proximoVencimiento=addDias(today(),30);
  addAudit('MAC registrada',`${c.num} — MAC: ${mac} — Estado → Activo. Instrucción enviada a Mikrotik.`);
  toast(`✅ MAC registrada. Contrato ${c.num} activado en Mikrotik.`,'success');
  closeModal();renderContratos();
}

function guardarPlan(id){
  const nombre=$('pl-nombre').value.trim();
  const bajada=parseInt($('pl-bajada').value);
  const subida=parseInt($('pl-subida').value)||0;
  const precio=parseInt($('pl-precio').value);
  const err=$('pl-err');
  if(!nombre||!bajada||!precio){err.textContent='Nombre, velocidad de bajada y precio son obligatorios.';err.style.display='block';return;}
  if(id){
    const p=S.planes.find(x=>x.id===id);
    addAudit('Plan editado',`${p.nombre} → Precio: ${fmt(p.precio)} → ${fmt(precio)}`);
    Object.assign(p,{nombre,bajada,subida,precio});
    toast('Plan actualizado','success');
  } else {
    const newId=S.nextIds.plan++;
    S.planes.push({id:newId,nombre,bajada,subida,precio,activo:true});
    addAudit('Plan creado',`${nombre} — ${fmt(precio)}/mes`);
    toast('Plan creado correctamente','success');
  }
  closeModal();renderPlanes();
}

function togglePlan(id,cnt){
  const p=S.planes.find(x=>x.id===id);
  if(p.activo&&cnt>0){toast('No se puede desactivar: tiene clientes activos. Use "Cancelar contratos" primero.','error');return;}
  p.activo=!p.activo;
  addAudit(`Plan ${p.activo?'activado':'desactivado'}`,p.nombre);
  toast(`Plan ${p.activo?'activado':'desactivado'}`,'info');
  renderPlanes();
}

  let facts=est?S.facturas.filter(f=>f.estado===est):S.facturas;
  facts=[...facts].sort((a,b)=>{
    const aActual=a.periodo===mesActual?0:1, bActual=b.periodo===mesActual?0:1;

function buscarFactura(){
  const q=$('r-buscar').value.trim().toLowerCase();

              S.facturas.find(f=>{const c=getContrato(f.cId);return c&&(c.nombre.toLowerCase().includes(q)||c.cedula.includes(q))&&f.estado!=='Pagada';});
  const res=$('r-result');
  const info=$('r-info');
  if(!factura){info.innerHTML='<span style="color:var(--red)">❌ No se encontró factura pendiente con ese criterio.</span>';res.style.display='block';window._facturaSeleccionada=null;$('r-monto').style.display='none';return;}
  if(factura.estado==='Pagada'){info.innerHTML=`<span style="color:var(--text2)">Esta factura ya fue pagada el ${factura.fechaPago}.</span>`;res.style.display='block';window._facturaSeleccionada=null;return;}
  window._facturaSeleccionada=factura;

  info.innerHTML=`

function confirmarPago(){
  const f=window._facturaSeleccionada;
  if(!f){toast('Busque primero una factura','error');return;}
  const monto=parseInt($('r-monto').value);
  const medio=$('r-medio').value;
  const total=facturaMonto(f);
  const err=$('r-err');
  const warn=$('r-warn');
  err.style.display='none';warn.style.display='none';
  if(!monto||monto<=0){err.textContent='Ingrese el monto recibido.';err.style.display='block';return;}
  if(monto!==total){
    warn.style.display='flex';
    $('r-warn .a-body').textContent=`⚠️ Monto ingresado (${fmt(monto)}) ≠ Monto adeudado (${fmt(total)}). ¿Confirmar de todas formas?`;
    warn.innerHTML+=`<button class="btn btn-orange btn-sm" style="margin-top:8px;background:var(--orange);color:#000" onclick="_ejecutarPago()">Confirmar de todas formas</button>`;
    return;
  }
  _ejecutarPago();
}

function _ejecutarPago(){
  const f=window._facturaSeleccionada;
  const monto=parseInt($('r-monto').value);
  const medio=$('r-medio').value;
  const c=getContrato(f.cId);
  const fechaPago=nowISO();
  f.estado='Pagada';f.fechaPago=fechaPago;f.cajero=S.user.u;
  const newPago={id:S.nextIds.pago++,fId:f.id,cId:f.cId,monto,fecha:fechaPago,medio,cajero:S.user.u};
  S.pagos.push(newPago);
  // Reactivar si estaba suspendido
  const reactivar=c.estado==='Suspendido por mora';
  if(reactivar){c.estado='Activo';c.mikrotikPendiente='conectar';addAudit('Reactivación automática',`${c.num} — ${c.nombre}. Instrucción enviada a Mikrotik RouterOS.`);}
  addAudit('Registro de pago',`${f.num} | ${c.num} | ${fmt(monto)} | ${medio}`);
  window._facturaSeleccionada=null;
  closeModal();
  // Show receipt modal
  abrirRecibo(f.id,newPago.id,reactivar);
}

function actualizarReporteIngresos(){
  const periodo=$('rp-mes')?.value||today().slice(0,7);
  const pagosP=S.pagos.filter(p=>p.fecha.startsWith(periodo));
  const factsP=S.facturas.filter(f=>f.periodo===periodo&&f.estado==='Pagada');
  const totalBase=factsP.reduce((a,f)=>a+f.base,0);
  const totalRecargos=factsP.reduce((a,f)=>a+f.recargo,0);
  const total=totalBase+totalRecargos;
  // Group by plan
  const porPlan={};
  factsP.forEach(f=>{
    const c=getContrato(f.cId);const pl=getPlan(c?.planId);
    const k=pl?.nombre||'Otros';
    if(!porPlan[k]){porPlan[k]={nombre:k,precio:pl?.precio||0,cnt:0,base:0,recargos:0};}
    porPlan[k].cnt++;porPlan[k].base+=f.base;porPlan[k].recargos+=f.recargo;
  });
  const activos=S.contratos.filter(c=>c.estado==='Activo').length;
  const suspendidos=S.contratos.filter(c=>c.estado==='Suspendido por mora').length;
  $('reporte-body').innerHTML=`
    <div class="kpi-grid" style="margin-bottom:20px">
      <div class="kpi-card green"><div class="kpi-label">Total Recaudado</div><div class="kpi-val" style="color:var(--green)">${fmt(total)}</div></div>
      <div class="kpi-card accent"><div class="kpi-label">Valor Base Servicio</div><div class="kpi-val" style="color:var(--accent)">${fmt(totalBase)}</div></div>
      <div class="kpi-card red"><div class="kpi-label">Recargos por Mora</div><div class="kpi-val" style="color:var(--red)">${fmt(totalRecargos)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Clientes al Cierre</div><div class="kpi-val">${activos}</div><div class="kpi-sub">${suspendidos} suspendidos</div></div>
    </div>
    <h3 style="font-family:'Syne',sans-serif;font-size:14px;margin-bottom:12px;color:var(--text2)">Desglose por Plan</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Plan</th><th>Precio/mes</th><th>Clientes Pagaron</th><th>Subtotal Servicio</th><th>Subtotal Recargos</th><th>Total Plan</th></tr></thead>
      <tbody>${Object.values(porPlan).map(r=>`
        <tr><td>${r.nombre}</td><td>${fmt(r.precio)}</td><td><span class="badge b-blue">${r.cnt}</span></td><td>${fmt(r.base)}</td><td style="color:var(--red)">${r.recargos?fmt(r.recargos):'—'}</td><td style="font-weight:600">${fmt(r.base+r.recargos)}</td></tr>
      `).join('')}${Object.keys(porPlan).length===0?`<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:24px">Sin pagos en este periodo</td></tr>`:''}</tbody>
      ${Object.keys(porPlan).length>0?`<tfoot><tr style="background:var(--surface2)"><td colspan="2" style="padding:11px 14px;font-weight:700">TOTAL GENERAL</td><td style="padding:11px 14px"><span class="badge b-blue">${factsP.length}</span></td><td style="padding:11px 14px;font-weight:700">${fmt(totalBase)}</td><td style="padding:11px 14px;font-weight:700;color:var(--red)">${fmt(totalRecargos)}</td><td style="padding:11px 14px;font-weight:700;color:var(--green)">${fmt(total)}</td></tr></tfoot>`:''}
    </table></div>
    ${S.user.rol==='contador'?`<div class="alert-box info" style="margin-top:16px"><div class="a-title">ℹ️ Perfil de solo lectura</div><div class="a-body">Como Contador, solo puede consultar y exportar. No puede modificar datos del sistema.</div></div>`:''}`;
}

  toast('Ticket marcado como resuelto','success');

  const clientes=S.contratos.filter(c=>c.estado==='Activo').length;

function _guardarConfig(mora,gracia,corte){
  addAudit('Cambio de configuración',`mora: ${S.config.porcMora}%→${mora}% | gracia: ${S.config.diasGracia}d→${gracia}d | corte: ${S.config.horarioCorte}→${corte}`);
  S.config.porcMora=mora;S.config.diasGracia=gracia;S.config.horarioCorte=corte;
  toast('Configuración guardada. Aplica desde mañana.','success');
  closeModal();renderConfig();
}
function guardarEmpresa(){
  S.config.empresa=$('cfg-empresa').value.trim()||S.config.empresa;
  S.config.nit=$('cfg-nit').value.trim()||S.config.nit;
  const file=$('cfg-logo').files[0];
  const terminar=()=>{
    addAudit('Datos empresa actualizados',`${S.config.empresa} — NIT: ${S.config.nit}`);
    toast('Datos de empresa guardados','success');
    aplicarBranding();
    renderConfig();
  };
  if(file){
    if(file.size>800*1024){toast('La imagen es muy pesada, usa una más pequeña (<800KB)','error');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{ S.config.logoBase64=e.target.result; terminar(); };
    reader.readAsDataURL(file);
  } else {
    terminar();
  }
}

// Cambia la contraseña del usuario actualmente autenticado (guardado en S.users)
function cambiarPassword(){
  const actual=$('cfg-pass-actual').value;
  const nueva=$('cfg-pass-nueva').value;
  const confirmar=$('cfg-pass-confirmar').value;
  const err=$('cfg-pass-err');
  err.style.display='none';
  const usr=S.users.find(u=>u.u===S.user.u);
  if(!usr){err.textContent='No se encontró tu usuario.';err.style.display='block';return;}
  if(usr.p!==actual){err.textContent='La contraseña actual no es correcta.';err.style.display='block';return;}
  if(nueva.length<6){err.textContent='La contraseña nueva debe tener mínimo 6 caracteres.';err.style.display='block';return;}
  if(nueva!==confirmar){err.textContent='La confirmación no coincide con la contraseña nueva.';err.style.display='block';return;}
  usr.p=nueva;
  guardarSesion(usr.u,nueva);
  addAudit('Cambio de contraseña',`Usuario ${usr.u} cambió su contraseña.`);
  toast('✅ Contraseña actualizada correctamente','success');
  $('cfg-pass-actual').value='';$('cfg-pass-nueva').value='';$('cfg-pass-confirmar').value='';
}

function guardarEmailRecuperacion(){
  const email=$('cfg-email-recup').value.trim();
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Correo inválido','error');return;}
  S.config.emailRecuperacion=email;
  addAudit('Correo de recuperación actualizado',email||'(vacío)');
  toast('Correo de recuperación guardado','success');
}

function closeModal(){$('modal-overlay').classList.remove('open');}

function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast-item ${type}`;
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  $('toast').appendChild(el);
  setTimeout(()=>el.remove(),4000);
}

// SCRUM-11: todo contrato debe tener periodosDeuda entero 0..2.
// Los contratos creados antes de v1.1 no tienen el campo (undefined) y se inicializan.
function migrarPeriodosDeuda(){
  if(!window.ISP) return;
  if(!Array.isArray(S.ordenesRetiro)) S.ordenesRetiro=[];
  let cambios=0;
  S.contratos.forEach(c=>{
    const {valor,anomalia}=window.ISP.normalizarContador(c.periodosDeuda);
    if(anomalia){ c.periodosDeuda=valor; cambios++; }
  });
  if(cambios>0){
    S.audit.unshift({id:Date.now(),usuario:'Sistema',fecha:now(),accion:'Migración periodosDeuda',detalle:`${cambios} contrato(s) inicializados con periodosDeuda normalizado (SCRUM-11).`});
    saveState();
  }
}

function timeout(ms){
  return new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT: Firestore no respondió a tiempo (revisa proyecto/reglas/red).')),ms));
}

window.onload=async ()=>{
  $('login-screen').style.display='none';
  try{
    await Promise.race([loadState(), timeout(15000)]);
    migrarPeriodosDeuda();
    procesarFacturacionAutomatica();
    aplicarBranding();
    if(!restaurarSesion()) $('login-screen').style.display='flex';
  }catch(e){
    console.error('Error cargando datos de Firestore:',e);
    const codigo = e && e.code ? e.code : (e && e.message ? e.message : 'desconocido');
    document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#FF4757;font-family:sans-serif;text-align:center;padding:20px;flex-direction:column;gap:10px">
      <div>⚠️ No se pudo conectar con la base de datos.</div>
      <div style="font-size:13px;color:#ccc;font-family:monospace">${codigo}</div>
      <div style="font-size:13px;color:#ccc;max-width:500px">Revisa: 1) que firebaseConfig tenga tus datos reales (no los de ejemplo), 2) que exista la base Firestore en tu proyecto, 3) las reglas en Firestore → Reglas.</div>
    </div>`;
  }
};
</script>
