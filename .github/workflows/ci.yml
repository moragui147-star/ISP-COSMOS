name: CI – pruebas estructurales

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Análisis estático (ESLint, complejidad ≤ 10)
        run: npm run lint
      - name: Pruebas Jest con cobertura (umbral 100 %)
        run: npm run test:coverage
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/
